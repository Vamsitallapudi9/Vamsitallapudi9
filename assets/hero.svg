<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Applied AI Engineer — Building production GenAI for clinical trials.">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#213183" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f1750" stop-opacity="0.55"/>
    </radialGradient>
    <style>
      .display { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; letter-spacing: -1.75px; fill: #ffffff; }
      .sub     { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 400; fill: rgba(255,255,255,0.75); }
      .mono    { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 600; letter-spacing: 2px; fill: #ffffff; font-size: 12px; }
    </style>
  </defs>

  <!-- Deep indigo night band -->
  <rect width="1200" height="320" fill="#213183"/>
  <rect width="1200" height="320" fill="url(#vignette)"/>

  <!-- Sticker constellation (decorative-only, per Notion Do/Don't) -->
  <g filter="url(#glow)" opacity="0.95">
    <circle cx="980"  cy="60"  r="5" fill="#d6b6f6"/>
    <circle cx="1050" cy="110" r="7" fill="#ff64c8"/>
    <circle cx="1120" cy="70"  r="4" fill="#62aef0"/>
    <circle cx="1010" cy="180" r="3" fill="#1aae39"/>
    <circle cx="1090" cy="220" r="6" fill="#dd5b00"/>
    <circle cx="940"  cy="240" r="4" fill="#2a9d99"/>
    <circle cx="1155" cy="160" r="3" fill="#d6b6f6"/>
    <circle cx="80"   cy="260" r="4" fill="#62aef0"/>
    <circle cx="140"  cy="230" r="3" fill="#ff64c8"/>
    <circle cx="60"   cy="80"  r="3" fill="#1aae39"/>
    <circle cx="180"  cy="60"  r="5" fill="#2a9d99"/>
  </g>

  <!-- Monogram pill (top-left) -->
  <g transform="translate(56, 48)">
    <rect width="132" height="28" rx="14" ry="14" fill="rgba(255,255,255,0.14)"/>
    <text class="mono" x="66" y="19" text-anchor="middle">Vamsi</text>
  </g>

  <!-- Display headline + subtitle -->
  <text class="display" x="56" y="180" font-size="56">Applied AI Engineer</text>
  <text class="sub"     x="56" y="216" font-size="20">Building production GenAI for clinical trials.</text>
</svg>
